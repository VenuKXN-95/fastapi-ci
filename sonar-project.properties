# ==============================================================================
# SonarQube / SonarCloud Project Properties
# ==============================================================================
# This file is read by the Sonar Scanner CLI during CI analysis.
# Secrets (sonar.token, sonar.host.url) are injected via GitHub Secrets
# and must NEVER be committed here.
# ==============================================================================

# ---------------------------------------------------------------------------
# Project Identity
# ---------------------------------------------------------------------------
sonar.organization=venukxn-95
sonar.projectKey=VenuKXN-95_fastapi-ci
sonar.projectName=fastapi-ci
sonar.projectVersion=1.0.0

# ---------------------------------------------------------------------------
# Source Layout
# ---------------------------------------------------------------------------
# Main application source
sonar.sources=app

# Test sources (separate so SonarQube counts them as test code)
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Language
# ---------------------------------------------------------------------------
sonar.language=python

# ---------------------------------------------------------------------------
# Coverage Report
# Generated by pytest-cov and uploaded in the "Unit Testing" step
# ---------------------------------------------------------------------------
sonar.python.coverage.reportPaths=coverage.xml

# ---------------------------------------------------------------------------
# Test Report
# Generated by pytest --junitxml=junit.xml
# ---------------------------------------------------------------------------
sonar.python.xunit.reportPath=junit.xml

# ---------------------------------------------------------------------------
# Exclusions
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/dist/**,\
  **/build/**,\
  **/htmlcov/**,\
  **/*.egg-info/**

sonar.test.exclusions=\
  **/migrations/**

sonar.coverage.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/__init__.py

# ---------------------------------------------------------------------------
# Quality Gate
# ---------------------------------------------------------------------------
# The Quality Gate is configured on the SonarQube / SonarCloud server.
# The CI step will fail automatically if the gate is not met.

# ---------------------------------------------------------------------------
# Links  (optional — useful in SonarQube project dashboard)
# ---------------------------------------------------------------------------
sonar.links.homepage=https://github.com/VenuKXN-95/fastapi-ci
sonar.links.ci=https://github.com/VenuKXN-95/fastapi-ci/actions
sonar.links.scm=https://github.com/VenuKXN-95/fastapi-ci
sonar.links.issue=https://github.com/VenuKXN-95/fastapi-ci/issues
